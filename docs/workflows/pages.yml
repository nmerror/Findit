name: Deploy the demo site

# Builds the project on the GitHub server, takes a screenshot of every screen
# and publishes them together with the project page on GitHub Pages:
# https://nmerror.github.io/Findit
#
# ONE-TIME SETUP (only needed once, by the repository owner):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the tools for the screenshots
        run: |
          sudo apt-get update
          sudo apt-get install -y libxext6 libxrender1 xvfb

      - name: Download the MySQL driver
        run: |
          mkdir -p lib
          curl -sSL -o lib/mysql-connector-j-8.4.0.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.4.0/mysql-connector-j-8.4.0.jar

      - name: Compile the application
        run: |
          mkdir -p target/classes
          find src/main/java -name '*.java' > target/srcs.txt
          javac -encoding UTF-8 -d target/classes @target/srcs.txt

      - name: Take the screenshots of every screen
        run: |
          mkdir -p docs/site/images
          for mode in login dashboard profile search users audit reports; do
            xvfb-run -a --server-args="-screen 0 1400x900x24" \
              java -cp "target/classes:lib/*" com.bubt.findit.tools.Screenshot "$mode" "docs/site/images/$mode.png"
          done
          xvfb-run -a --server-args="-screen 0 1400x900x24" \
            java -cp "target/classes:lib/*" com.bubt.findit.tools.Screenshot demo docs/site/images/dashboard-mysql.png --mysql
          cp docs/images/architecture.svg docs/site/images/architecture.svg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
