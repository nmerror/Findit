# ---------------------------------------------------------------------------
# FindIt - application settings
# Copy this file next to your jar (or into src/main/resources) and edit it.
# ---------------------------------------------------------------------------

app.name = FindIt

# mysql  -> real database (MySQL 8, run sql/01_schema.sql first)
# memory -> everything in RAM, no database server needed (for demos / self-test)
app.mode = mysql

db.url      = jdbc:mysql://localhost:3306/findit?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.user     = root
db.password =
db.driver   = com.mysql.cj.jdbc.Driver

# How long a login stays valid.
session.timeout.minutes = 60

# Palette the application starts in: dark or light
app.theme = dark
